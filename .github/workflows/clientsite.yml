name: angular test app
 
env:
  BUILD_PATH: '.'
  
on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch: 

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  id-token: write

jobs:
  prod:   
    runs-on: ubuntu-latest
    if: ((github.ref == 'refs/heads/main') && github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed'))
    environment: Main
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
 
    - name: Install dependencies
      run: |
        npm install --legacy-peer-deps
        npm run build -- --configuration production
      working-directory: ${{ env.BUILD_PATH }}   
 
    - name: Login to Azure
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZ_CLIENT_ID }}
        tenant-id: ${{ secrets.AZ_TENANT_ID}}
        subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }} 
 
    - name: Deploy to Azure
      uses: azure/webapps-deploy@v3.0.0
      with:
        app-name: ${{ secrets.AZURE_PROD_WEBAPP_FRONT_NAME }}
        package: ${{ env.BUILD_PATH }}/dist/webapitest-client/browser
        startup-command: pm2 serve /home/site/wwwroot --no-daemon --spa
